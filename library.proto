syntax = "proto3";

package library;

// --- Entities ---
message Author {
  int32 author_id = 1;
  string name = 2;
}

message Book {
  int32 book_id = 1;
  string title = 2;
  int32 author_id = 3;
}

message Review {
  int32 review_id = 1;
  int32 book_id = 2;
  int32 rating = 3;
  string review_text = 4;
}

// --- Request/Response Wrappers ---

// Workaround for empty block error: requires at least one field
message EmptyRequest {
  bool fetch = 1;
}

message IdRequest {
  int32 id = 1;
}

message AuthorsResponse {
  repeated Author authors = 1;
}

message BooksResponse {
  repeated Book books = 1;
}

message ReviewsResponse {
  repeated Review reviews = 1;
}

message AddBookRequest {
  string title = 1;
  int32 author_id = 2;
}

message UpdateBookRequest {
  int32 id = 1;
  string title = 2;
  int32 author_id = 3;
}

message DeleteBookResponse {
  bool success = 1;
}

// --- Service Operations (Queries and Mutations) ---
service LibraryAPI {
  // Read Operations (Queries)
  rpc GetAuthors(EmptyRequest) returns (AuthorsResponse);
  rpc GetAuthor(IdRequest) returns (Author);
  
  rpc GetBooks(EmptyRequest) returns (BooksResponse);
  rpc GetBook(IdRequest) returns (Book);
  
  rpc GetReviews(EmptyRequest) returns (ReviewsResponse);
  rpc GetReview(IdRequest) returns (Review);
  
  // Write Operations (Mutations)
  rpc AddBook(AddBookRequest) returns (Book);
  rpc UpdateBook(UpdateBookRequest) returns (Book);
  rpc DeleteBook(IdRequest) returns (DeleteBookResponse);
}
